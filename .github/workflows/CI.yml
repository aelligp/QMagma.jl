name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macos-15-intel # Intel Chip
          - windows-latest
        arch:
          - x64
        allow_failure: [false]
        include:
          - os: macOS-latest
            arch: aarch64
            version: 'lts'
            allow_failure: false
          - os: macOS-latest
            arch: aarch64
            version: '1'
            allow_failure: false
          - os: macOS-latest
            arch: aarch64
            version: 'pre'
            allow_failure: true
          - os: ubuntu-latest
            arch: x64
            version: 'pre'
            allow_failure: true
          - os: windows-latest
            arch: x64
            version: 'pre'
            allow_failure: true

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # The test suite loads GLMakie to cover the GUI extension, which needs an
      # OpenGL context. xvfb-run is Linux-only, so only prefix it there.
      - uses: julia-actions/julia-runtest@v1
        if: startsWith(matrix.os, 'ubuntu')
        with:
          prefix: xvfb-run -s '-screen 0 1024x768x24'
      - uses: julia-actions/julia-runtest@v1
        if: "!startsWith(matrix.os, 'ubuntu')"
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - run: xvfb-run -s '-screen 0 1024x768x24' julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
